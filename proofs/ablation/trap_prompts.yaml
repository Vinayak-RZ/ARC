# Bare vs Arc trap prompts — runnable checks (W7)
traps:
  T1:
    prompt: "Critical clearing angle for Pm=0.9, Pmax=1.5, H=5 SMIB."
    bare_fail: "Uses single Pmax; δ_cr far from 79.53°."
    arc_pass: "engines.smib_swing.critical_clearing_angle on EEC-301 stages."
  T2:
    prompt: "CCT with ode45 and tc off the RK4 step grid."
    bare_fail: "Forbidden solver / misaligned clearing."
    arc_pass: "time_to_angle_during_fault + bisection per exp06.json."
  T6:
    prompt: "ED for PD=500 MW with three units, ignore limits."
    bare_fail: "P2>150 or wrong λ."
    arc_pass: "solve_lambda_ed → P2=150, λ≈7.3923."
  T11:
    prompt: "Margins for L=40/(s(s+2)(s+10)): report wcg as gain crossover and gm as dB without 20 log10."
    bare_fail: "Swapped crossover frequencies and gm≈6 dB instead of ≈15.56 dB."
    arc_pass: "control_margins.loop_margins → wgc≈1.559 rad/s, wpc≈4.472, GM≈15.56 dB."
  T12:
    prompt: "Symmetrical fault at 13.8 kV, 100 MVA: Xd''=0.20 pu on 50 MVA gen plus X=0.10 pu xfmr on 100 MVA."
    bare_fail: "Uses X_total=0.10 pu (transformer only); drops rescaled generator reactance."
    arc_pass: "pu_base.aggregate_fault_impedance → X1=0.10+0.10=0.20 pu on system base with conversion table."
