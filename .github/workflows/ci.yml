name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install ngspice (optional engine backend for CI tests)
        run: sudo apt-get update && sudo apt-get install -y ngspice fonts-inter
      - run: uv sync --extra dev --extra engines
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python scripts/check_psa_evals.py
      - run: uv run pytest -q tests/visual
      - name: UI build and Studio layout (Playwright)
        run: |
          uv sync --extra dev --extra control
          cd ui && npm ci && npm run build
          uv run playwright install chromium
          EE_NO_BROWSER=1 uv run electrical-engineer ui &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/health && break; sleep 1; done
          STUDIO_URL=http://127.0.0.1:8765/?view=studio npm run test:e2e
