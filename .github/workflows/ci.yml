name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install ngspice (optional engine backend for CI tests)
        run: sudo apt-get update && sudo apt-get install -y ngspice fonts-inter
      - name: Build UI before Python editable install
        run: cd ui && npm ci && npm run build
      - run: uv sync --extra dev --extra engines
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run electrical-engineer hosts smoke
      - run: uv run python scripts/check_psa_evals.py
      - run: uv run python scripts/check_circuit_evals.py
      - run: uv run python -c "from electrical_engineer.rlvr_env import ArcRlvrEnv, contract_json; print(contract_json())"
      - run: uv run python scripts/rlvr_dummy_rollout.py
      - run: uv run python scripts/build_benchmark_v01.py
      - run: uv run python scripts/grade_benchmark_v01.py
      - run: uv run pytest -q tests/visual
      - name: UI build and Studio layout (Playwright)
        run: |
          uv sync --extra dev --extra control
          cd ui && npx playwright install --with-deps chromium && npm run build
          cd ..
          EE_NO_BROWSER=1 uv run electrical-engineer ui &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/api/health && break; sleep 1; done
          cd ui && STUDIO_URL=http://127.0.0.1:8765/?view=studio npm run test:e2e
      - name: Capture round smoke (collab-01, rectifier, studio resize)
        run: |
          fuser -k 8765/tcp 2>/dev/null || true
          sleep 1
          uv run python scripts/capture_round.py --round 0 --smoke
