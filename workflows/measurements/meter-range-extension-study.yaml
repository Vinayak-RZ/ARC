id: meter-range-extension-study
title: Ammeter shunt and voltmeter multiplier study
pack: measurements
sample_problem:
  kind: ammeter_shunt
  rm: 50
  im_fs: 0.001
  i_range: 1
  expected: 0.05005
  tol: 1e-4
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: meter_range_extension
    capability: measurement-model
  check:
    activity: check-numeric
    default_solver: meter_range_extension
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]