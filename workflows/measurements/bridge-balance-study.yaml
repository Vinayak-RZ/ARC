id: bridge-balance-study
title: Wheatstone and AC bridge balance study
pack: measurements
sample_problem:
  bridge: wheatstone
  r1: 100
  r2: 200
  r3: 50
  expected: 100
  tol: 1e-6
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: bridge_balance
    capability: measurement-model
  check:
    activity: check-numeric
    default_solver: bridge_balance
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]