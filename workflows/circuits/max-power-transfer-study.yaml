id: max-power-transfer-study
title: AC maximum power transfer study
pack: circuits
sample_problem:
  vth_rms: 10
  rth: 50
  xth: 0
  expected: 0.5
  tol: 1e-6
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: max_power_transfer
    capability: lumped-circuit-sim
  check:
    activity: check-numeric
    default_solver: max_power_transfer
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]