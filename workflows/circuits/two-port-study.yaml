id: two-port-study
title: Two-port parameter conversion study
pack: circuits
sample_problem:
  from_set: z
  to_set: y
  m:
    - [10, 5]
    - [5, 20]
  expected: 0.114286
  tol: 1e-4
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: two_port_convert
    capability: lumped-circuit-sim
  check:
    activity: check-numeric
    default_solver: two_port_convert
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]