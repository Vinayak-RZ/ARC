id: resonance-study
title: RLC resonance frequency study
pack: circuits
sample_problem:
  r: 10
  l: 0.01
  c: 0.000001
  config: series
  expected: 1591.55
  tol: 1
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: resonance
    capability: lumped-circuit-sim
  check:
    activity: check-numeric
    default_solver: resonance
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]