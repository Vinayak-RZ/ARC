id: solve-signals-problem
nodes:
  retrieve:
    activity: retrieve-passage
  solve:
    activity: solve-explain
    needs: [retrieve]
  web:
    activity: web-verify
    needs: [retrieve, solve]
  check:
    activity: check-numeric
    needs: [solve, web]
  trap:
    activity: trap-verify
    needs: [solve, web]
  label:
    activity: label-unchecked
    needs: [trap, check, web]
  summary:
    activity: write-run-summary
    needs: [label]
