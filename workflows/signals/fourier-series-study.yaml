id: fourier-series-study
title: Fourier series harmonic study
pack: signals
sample_problem:
  waveform: square
  amplitude: 1
  f0_hz: 50
  n_harmonics: 9
  expected: 1.2732
  tol: 1e-3
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: fourier_series_std
    capability: signal-analysis
  check:
    activity: check-numeric
    default_solver: fourier_series_std
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]