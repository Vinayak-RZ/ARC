id: rectifier-3ph-study
title: Three-phase controlled rectifier
pack: power_electronics
sample_problem:
  v_ll_rms: 415
  alpha_deg: 45
  topology: full
  io_a: 0
  ls_h: 0
  f_hz: 50
  expected: 396.29
  tol: 1e-3
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: rectifier_3ph
    capability: converter-model
  check:
    activity: check-numeric
    default_solver: rectifier_3ph
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]