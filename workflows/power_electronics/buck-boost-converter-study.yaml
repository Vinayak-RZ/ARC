id: buck-boost-converter-study
title: Buck-boost converter CCM
pack: power_electronics
sample_problem:
  vin: 12
  d: 0.6
  l: 0.0001
  c: 0.00001
  fs: 100000
  r: 10
  expected: -18
  tol: 1e-3
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: buck_boost_ccm
    capability: converter-model
  check:
    activity: check-numeric
    default_solver: buck_boost_ccm
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]