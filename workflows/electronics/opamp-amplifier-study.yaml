id: opamp-amplifier-study
title: Op-amp amplifier configurations study
pack: electronics
sample_problem:
  config: inverting
  vin: [1]
  rf: 10000
  r1: 1000
  expected: -10
  tol: 1e-6
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: opamp_config
    capability: algebraic-check
  check:
    activity: check-numeric
    default_solver: opamp_config
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]