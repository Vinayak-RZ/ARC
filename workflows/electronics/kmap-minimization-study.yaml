id: kmap-minimization-study
title: Karnaugh map minimization study
pack: electronics
sample_problem:
  n_vars: 4
  minterms: [0, 1, 2, 5, 6, 7, 8, 9, 10, 14]
  expected: 7
  tol: 0.5
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: kmap_minimize
    capability: algebraic-check
  check:
    activity: check-numeric
    default_solver: kmap_minimize
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]