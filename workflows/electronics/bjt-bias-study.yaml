id: bjt-bias-study
title: BJT divider bias study
pack: electronics
sample_problem:
  vcc: 12
  r1: 10000
  r2: 2200
  rc: 1000
  re: 220
  beta: 100
  expected: 0.006094
  tol: 1e-4
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: bjt_divider_bias
    capability: algebraic-check
  check:
    activity: check-numeric
    default_solver: bjt_divider_bias
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]