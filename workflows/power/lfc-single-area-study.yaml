id: lfc-single-area-study
title: Single-area load frequency control
pack: power
sample_problem:
  delta_pd_pu: 0.01
  r_pu: 0.05
  d_pu: 1
  f_hz: 50
  expected: -0.02381
  tol: 1e-4
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: lfc_single_area
    capability: power-network-study
  check:
    activity: check-numeric
    default_solver: lfc_single_area
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]