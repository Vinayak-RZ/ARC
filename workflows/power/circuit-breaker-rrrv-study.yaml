id: circuit-breaker-rrrv-study
title: Circuit breaker RRRV
pack: power
sample_problem:
  v_ll_kv: 11
  l_h: 0.006
  c_f: 1.0e-8
  expected: 1.159e9
  tol: 1e-2
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: cb_rrrv
    capability: power-network-study
  check:
    activity: check-numeric
    default_solver: cb_rrrv
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]