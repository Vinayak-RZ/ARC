id: distance-mho-study
title: Mho relay reach setting
pack: power
sample_problem:
  z_line_ohm: 10
  line_angle_deg: 75
  reach_pct: 80
  ct_ratio: 600
  vt_ratio: 1200
  expected: 4.0
  tol: 1e-3
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: mho_reach
    capability: power-network-study
  check:
    activity: check-numeric
    default_solver: mho_reach
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]