id: solve-power-problem
nodes:
  retrieve:
    activity: retrieve-passage
  flow:
    activity: run-load-flow
    optional: true
    needs: [retrieve]
  solve:
    activity: solve-explain
    needs: [flow]
  web:
    activity: web-verify
    needs: [retrieve, flow, solve]
  check:
    activity: check-numeric
    needs: [solve, web]
  trap:
    activity: trap-verify
    needs: [solve, web]
  label:
    activity: label-unchecked
    needs: [trap, check, web]
  summary:
    activity: write-run-summary
    needs: [label]
