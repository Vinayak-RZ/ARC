id: critical-clearing-study
title: Equal-area critical clearing angle
pack: power
sample_problem:
  pm_pu: 1
  pmax_pre_pu: 2
  pmax_post_pu: 2
  pmax_fault_pu: 0
  h_s: 5
  f_hz: 50
  expected: 79.56
  tol: 1e-2
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: equal_area_critical
    capability: power-network-study
  check:
    activity: check-numeric
    default_solver: equal_area_critical
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]