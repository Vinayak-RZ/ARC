id: differential-protection-study
title: Differential protection bias
pack: power
sample_problem:
  i1_a: 5
  i2_a: 4
  expected: 1.0
  tol: 1e-6
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: differential_bias
    capability: power-network-study
  check:
    activity: check-numeric
    default_solver: differential_bias
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]