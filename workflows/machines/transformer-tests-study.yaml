id: transformer-tests-study
title: Transformer OC and SC tests study
pack: machines
sample_problem:
  kva: 100
  v_lv: 400
  v_hv: 11000
  oc_v: 400
  oc_i: 2
  oc_p: 300
  sc_v: 500
  sc_i: 5
  sc_p: 1500
  load_frac: 1
  pf: 0.8
  expected: 93.832
  tol: 0.05
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: transformer_oc_sc
    capability: machine-model
  check:
    activity: check-numeric
    default_solver: transformer_oc_sc
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]