id: induction-torque-slip-study
title: Induction motor torque versus slip study
pack: machines
sample_problem:
  v_ll: 400
  f_hz: 50
  poles: 4
  r1: 0.2
  x1: 0.5
  r2: 0.15
  x2: 0.4
  xm: 15
  slip: 0.05
  expected: 261.447
  tol: 0.5
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: induction_torque_slip
    capability: machine-model
  check:
    activity: check-numeric
    default_solver: induction_torque_slip
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]