id: solve-digital-control-problem
nodes:
  dig:
    activity: run-digital-control
  web:
    activity: web-verify
    needs: [dig]
  trap:
    activity: trap-verify
    needs: [web]
  label:
    activity: label-unchecked
    needs: [trap, dig, web]
  summary:
    activity: write-run-summary
    needs: [label]
