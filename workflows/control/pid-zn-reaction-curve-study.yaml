id: pid-zn-reaction-curve-study
title: Ziegler-Nichols reaction curve PID
pack: control
sample_problem:
  k_plant: 2
  l_s: 1
  t_s: 10
  mode: PID
  expected: 6
  tol: 1e-6
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: zn_reaction_curve
    capability: lti-analysis
  check:
    activity: check-numeric
    default_solver: zn_reaction_curve
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]