id: solve-control-problem
nodes:
  exam:
    activity: run-ee-v2-solver
  ctrl:
    activity: run-python-control
  web:
    activity: web-verify
    needs: [exam, ctrl]
  check:
    activity: check-numeric
    needs: [exam, ctrl, web]
  trap:
    activity: trap-verify
    needs: [exam, ctrl, web]
  label:
    activity: label-unchecked
    needs: [trap, check, ctrl, web]
  summary:
    activity: write-run-summary
    needs: [label]
