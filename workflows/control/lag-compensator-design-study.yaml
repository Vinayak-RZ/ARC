id: lag-compensator-design-study
title: Lag compensator design
pack: control
sample_problem:
  num: [1]
  den: [1, 1, 0]
  k: 10
  pm_target_deg: 45
  epsilon_deg: 5
  expected: 999.95
  tol: 0.01
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: lag_compensator
    capability: lti-analysis
  check:
    activity: check-numeric
    default_solver: lag_compensator
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]