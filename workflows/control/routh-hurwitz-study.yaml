id: routh-hurwitz-study
title: Routh-Hurwitz stability
pack: control
sample_problem:
  coeffs: [1, 1, 2, 8]
  expected: 2
  tol: 1e-6
nodes:
  solve:
    activity: run-ee-v2-solver
    default_solver: routh_hurwitz
    capability: lti-analysis
  check:
    activity: check-numeric
    default_solver: routh_hurwitz
    needs: [solve]
  trap:
    activity: trap-verify
    needs: [solve]
  label:
    activity: label-unchecked
    needs: [trap, check]
  summary:
    activity: write-run-summary
    needs: [label]