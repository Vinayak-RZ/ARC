    A: 19.61
    B: 0.491
    p: 2.0
    formula_note: t = TD*(A/(M^p - 1) + B)
  source:
    title: IEEE C37.112-1996
    edition: "1996"
    clause: CO-8 coefficients
  url: https://standards.ieee.org/standard/C37_112-1996.html
  license: Factual coefficients; no standard text copied
  verification: M=10, TD=1 -> t about 0.806 s

