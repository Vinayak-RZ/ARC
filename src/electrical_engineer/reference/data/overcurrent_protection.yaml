- id: IEC_SI
  domain: overcurrent_protection
  title: IEC 60255 standard inverse (SI) IDMT constants
  aliases: [IEC SI, standard inverse, SI curve, 60255 SI]
  values:
    standard: IEC
    k: 0.14
    alpha: 0.02
    formula_note: t = k*TMS/(M^alpha - 1), M = I/Ipickup
  source:
    title: IEC 60255-151
    edition: "2009"
    clause: inverse-time characteristic SI
  url: https://webstore.iec.ch/en/publication/6762
  license: Standard constants (factual); no standard text reproduced
  verification: At M=10, TMS=1 -> t approx 2.97 s hand check

