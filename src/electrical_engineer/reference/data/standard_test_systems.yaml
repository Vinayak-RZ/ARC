- id: IEEE_CASE_9_GENCOST
  domain: standard_test_systems
  title: MATPOWER case9 quadratic generator costs by bus
  aliases: [case9 gencost, case9 economic dispatch]
  values:
    total_load_mw_default: 315
    generators:
      - bus: 1
        c2: 0.11
        c1: 5
        c0: 150
        pmin_mw: 10
        pmax_mw: 250
      - bus: 2
        c2: 0.085
        c1: 1.2
        c0: 600
        pmin_mw: 10
        pmax_mw: 300
      - bus: 3
        c2: 0.1225
        c1: 1
        c0: 335
        pmin_mw: 10
        pmax_mw: 270
  value_conditions:
    c2: quadratic coefficient on P^2 (MATPOWER gencost model 2)
    c1: linear coefficient on P
    c0: fixed cost term per hour
    pmin_mw: generator active power minimum from mpc.gen
    pmax_mw: generator active power maximum from mpc.gen
    total_load_mw_default: sum bus Pd for case9 (90+100+125 MW)
  confidence: verified_dual
  source:
    title: MATPOWER case9.m
    edition: "7.1"
    clause: mpc.gencost and mpc.gen
  source_secondary:
    title: Chow Time-Scale Modeling of Dynamic Networks case 9 data
    edition: "1982"
    clause: generator cost reproduction
    url: https://github.com/MATPOWER/matpower/blob/master/data/case9.m
  url: https://github.com/MATPOWER/matpower/blob/master/data/case9.m
  license: BSD-3-Clause
  verification: ED lambda=33.06 MW/MW yields P1=127.56 P2=187.44 with gen3 OOS

