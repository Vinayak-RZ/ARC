- id: SVERAK_GRID_RESISTANCE_FORMULA
  domain: earthing_safety
  title: Sverak empirical substation grid resistance formula note
  aliases: [Sverak, grid resistance formula]
  values:
    formula_note: R = rho * (1/sqrt(20*A) + 1/L) with A area m2, L perimeter m
    units: ohm
  source:
    title: IEEE 80 ground grid design
    edition: "2013"
    clause: empirical approximations section
  url: https://standards.ieee.org/standard/80-2013.html
  license: Factual formula reference; use with measured rho
  verification: Documented in syllabus; numeric case deferred to problem data
